name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: react-data-inspector-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        react: ['18.3.1', '19.3.0']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Select React version
        run: npm install --no-save --ignore-scripts react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - name: Run quality gate
        run: npm run check
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser suite
        run: npm run test:e2e
      - name: Run model benchmarks
        run: npm run benchmark
      - name: Preserve failure evidence
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: evidence-react-${{ matrix.react }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            test-results/
            playwright-report/
            benchmarks/results.json

  verify:
    name: Verified
    if: always()
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Require every React version to pass
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success

  deploy:
    name: Deploy website
    needs: verify
    if: "needs.verify.result == 'success' && github.event_name != 'pull_request' && github.ref_type != 'tag'"
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DEPLOY_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build verified website
        run: npm run build:website
        env:
          REQUIRE_NPM_PUBLICATION: 'true'
      - name: Deploy verified website
        id: deploy
        run: node scripts/deploy-website.mjs
